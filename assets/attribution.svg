<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">A diagnostic model needs a useful cadence</title><desc id="desc">Monthly diagnostics keep coefficients fixed, quarterly refreshes re-estimate them, and annual reviews reconsider the variables.</desc><rect width="880" height="440" rx="12" fill="#f1f4ef"/><g font-family="Arial,sans-serif" fill="#243c32">
<text x="44" y="55" font-size="14" letter-spacing="2">MODELING AROUND THE DECISION CADENCE</text>
<text x="44" y="108" font-size="29">Why did sales change this month?</text>
<path d="M94 192H786" stroke="#a9baa5" stroke-width="3"/>
<circle cx="94" cy="192" r="9" fill="#2f5542"/><circle cx="414" cy="192" r="9" fill="#2f5542"/><circle cx="746" cy="192" r="9" fill="#2f5542"/>
<text x="44" y="248" font-size="24">Monthly</text><text x="44" y="282" font-size="17">Explain movement</text><text x="44" y="310" font-size="15" fill="#65766b">Keep coefficients fixed</text>
<text x="354" y="248" font-size="24">Quarterly</text><text x="354" y="282" font-size="17">Refresh the model</text><text x="354" y="310" font-size="15" fill="#65766b">Re-estimate coefficients</text>
<text x="664" y="248" font-size="24">Annually</text><text x="664" y="282" font-size="17">Revisit assumptions</text><text x="664" y="310" font-size="15" fill="#65766b">Review variables and window</text>
<text x="44" y="405" font-size="14" fill="#65766b">Reconstructed workflow. This model supports diagnosis, not causal attribution.</text></g></svg>