<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">From a manual deck to an automated pipeline</title><desc id="d">Excel and PowerPoint deck replaced by SQL on Snowflake, Python with QC checks and a Power BI dashboard refreshed in one click.</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#243c32"/></marker></defs>
<rect width="1200" height="480" fill="#f6f7f2" rx="10"/><g font-family="Arial,sans-serif">
<text x="45" y="62" font-size="30" font-weight="600" fill="#243c32">From a manual deck to a one-click pipeline</text>
<text x="45" y="98" font-size="18" fill="#66756c">Weekly account-health reporting, rebuilt end to end.</text><rect x="45" y="170" width="255" height="170" rx="10" fill="#fff" stroke="#b56d4d" stroke-width="2.5"/><text x="65" y="205" font-size="15" font-weight="700" fill="#b56d4d" letter-spacing="1.5">BEFORE</text><text x="65" y="250" font-size="21" font-weight="700" fill="#243c32">Excel + PowerPoint</text><text x="65" y="285" font-size="16" fill="#66756c">60+ slides, built by hand</text><path d="M303 255 h22" stroke="#243c32" stroke-width="3" marker-end="url(#pa)"/><rect x="330" y="170" width="255" height="170" rx="10" fill="#fff" stroke="#355f47" stroke-width="2.5"/><text x="350" y="205" font-size="15" font-weight="700" fill="#355f47" letter-spacing="1.5">PULL</text><text x="350" y="250" font-size="21" font-weight="700" fill="#243c32">SQL on Snowflake</text><text x="350" y="285" font-size="16" fill="#66756c">automated weekly queries</text><path d="M588 255 h22" stroke="#243c32" stroke-width="3" marker-end="url(#pa)"/><rect x="615" y="170" width="255" height="170" rx="10" fill="#fff" stroke="#355f47" stroke-width="2.5"/><text x="635" y="205" font-size="15" font-weight="700" fill="#355f47" letter-spacing="1.5">PREPARE</text><text x="635" y="250" font-size="21" font-weight="700" fill="#243c32">Python</text><text x="635" y="285" font-size="16" fill="#66756c">workbook + QC checks</text><path d="M873 255 h22" stroke="#243c32" stroke-width="3" marker-end="url(#pa)"/><rect x="900" y="170" width="255" height="170" rx="10" fill="#fff" stroke="#355f47" stroke-width="2.5"/><text x="920" y="205" font-size="15" font-weight="700" fill="#355f47" letter-spacing="1.5">PUBLISH</text><text x="920" y="250" font-size="21" font-weight="700" fill="#243c32">Power BI</text><text x="920" y="285" font-size="16" fill="#66756c">one-click weekly refresh</text>
<text x="45" y="410" font-size="22" fill="#243c32">Weekly processing: <tspan font-weight="700">about 8 hours</tspan> before, <tspan font-weight="700" fill="#355f47">about 20 minutes</tspan> after</text>
</g></svg>