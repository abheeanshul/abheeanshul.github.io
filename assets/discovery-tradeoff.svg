<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Discovery budget tradeoff</title><desc id="d">Recall at 10 falls from 0.3604 with no discovery slot to 0.3470, 0.3313 and 0.3135 with one, two and three slots. Share of evaluated users with a new item in their top 10 rises from 6.66% to 99.96% with one slot.</desc><rect width="1200" height="650" fill="#f6f7f2" rx="10"/><g font-family="Arial,sans-serif"><text x="45.0" y="55.0" font-size="30" fill="#243c32" text-anchor="start" font-weight="600">One reserved slot costs 1.3 points of recall@10</text><text x="45.0" y="91.0" font-size="18" fill="#66756c" text-anchor="start" font-weight="400">Offline evaluation, two-channel model, 26,258 held-out users.</text><line x1="270" y1="440.0" x2="1130" y2="440.0" stroke="#e0e6dc"/><text x="258.0" y="446.0" font-size="16" fill="#66756c" text-anchor="end" font-weight="400">0.30</text><line x1="270" y1="357.1" x2="1130" y2="357.1" stroke="#e0e6dc"/><text x="258.0" y="363.1" font-size="16" fill="#66756c" text-anchor="end" font-weight="400">0.32</text><line x1="270" y1="274.3" x2="1130" y2="274.3" stroke="#e0e6dc"/><text x="258.0" y="280.3" font-size="16" fill="#66756c" text-anchor="end" font-weight="400">0.34</text><line x1="270" y1="191.4" x2="1130" y2="191.4" stroke="#e0e6dc"/><text x="258.0" y="197.4" font-size="16" fill="#66756c" text-anchor="end" font-weight="400">0.36</text><polyline points="300.0,189.8 566.7,245.3 833.3,310.3 1100.0,384.1" fill="none" stroke="#355f47" stroke-width="3"/><circle cx="300.0" cy="189.8" r="8" fill="#355f47" stroke="#f6f7f2" stroke-width="2"/><text x="300.0" y="169.8" font-size="18" fill="#243c32" text-anchor="middle" font-weight="600">0.3604</text><text x="300.0" y="480.0" font-size="17" fill="#243c32" text-anchor="middle" font-weight="400">0 slots</text><circle cx="566.7" cy="245.3" r="8" fill="#355f47" stroke="#f6f7f2" stroke-width="2"/><text x="566.7" y="225.3" font-size="18" fill="#243c32" text-anchor="middle" font-weight="600">0.3470</text><text x="566.7" y="480.0" font-size="17" fill="#243c32" text-anchor="middle" font-weight="400">1 slot</text><circle cx="833.3" cy="310.3" r="8" fill="#355f47" stroke="#f6f7f2" stroke-width="2"/><text x="833.3" y="290.3" font-size="18" fill="#243c32" text-anchor="middle" font-weight="600">0.3313</text><text x="833.3" y="480.0" font-size="17" fill="#243c32" text-anchor="middle" font-weight="400">2 slots</text><circle cx="1100.0" cy="384.1" r="8" fill="#355f47" stroke="#f6f7f2" stroke-width="2"/><text x="1100.0" y="364.1" font-size="18" fill="#243c32" text-anchor="middle" font-weight="600">0.3135</text><text x="1100.0" y="480.0" font-size="17" fill="#243c32" text-anchor="middle" font-weight="400">3 slots</text><line x1="270" y1="510" x2="1130" y2="510" stroke="#e0e6dc"/><text x="45.0" y="552.0" font-size="16" fill="#66756c" text-anchor="start" font-weight="400">Users with a new</text><text x="45.0" y="574.0" font-size="16" fill="#66756c" text-anchor="start" font-weight="400">item in top 10</text><text x="300.0" y="562.0" font-size="22" fill="#b56d4d" text-anchor="middle" font-weight="600">6.66%</text><text x="566.7" y="562.0" font-size="22" fill="#355f47" text-anchor="middle" font-weight="600">99.96%</text><text x="833.3" y="562.0" font-size="22" fill="#355f47" text-anchor="middle" font-weight="600">99.96%</text><text x="1100.0" y="562.0" font-size="22" fill="#355f47" text-anchor="middle" font-weight="600">99.96%</text></g></svg>