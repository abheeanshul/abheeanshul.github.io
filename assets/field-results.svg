<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Execution and adoption after launch</title><desc id="chart-desc">Non-users receiving more than one call monthly increased from 18 to 45 percent. Conversion was 33 percent, or 64 of 194 eligible prescribers, compared with a 24 percent historical baseline.</desc><rect width="1200" height="650" fill="#f6f7f2" rx="10"/><g font-family="Arial,sans-serif"><text x="45.00" y="55.00" font-size="30" fill="#243c32" text-anchor="start" font-weight="600">Execution and adoption after launch</text><text x="45.00" y="91.00" font-size="18" fill="#66756c" text-anchor="start" font-weight="400">Two distinct measures over the first 13 weeks of the field program.</text><line x1="395.00" y1="175.00" x2="395.00" y2="455.00" stroke="#e0e6dc" stroke-width="1"/><text x="395.00" y="490.00" font-size="17" fill="#66756c" text-anchor="middle" font-weight="400">0%</text><line x1="532.00" y1="175.00" x2="532.00" y2="455.00" stroke="#e0e6dc" stroke-width="1"/><text x="532.00" y="490.00" font-size="17" fill="#66756c" text-anchor="middle" font-weight="400">10%</text><line x1="669.00" y1="175.00" x2="669.00" y2="455.00" stroke="#e0e6dc" stroke-width="1"/><text x="669.00" y="490.00" font-size="17" fill="#66756c" text-anchor="middle" font-weight="400">20%</text><line x1="806.00" y1="175.00" x2="806.00" y2="455.00" stroke="#e0e6dc" stroke-width="1"/><text x="806.00" y="490.00" font-size="17" fill="#66756c" text-anchor="middle" font-weight="400">30%</text><line x1="943.00" y1="175.00" x2="943.00" y2="455.00" stroke="#e0e6dc" stroke-width="1"/><text x="943.00" y="490.00" font-size="17" fill="#66756c" text-anchor="middle" font-weight="400">40%</text><line x1="1080.00" y1="175.00" x2="1080.00" y2="455.00" stroke="#e0e6dc" stroke-width="1"/><text x="1080.00" y="490.00" font-size="17" fill="#66756c" text-anchor="middle" font-weight="400">50%</text><text x="45.00" y="237.00" font-size="23" fill="#243c32" text-anchor="start" font-weight="600">Call frequency</text><text x="45.00" y="267.00" font-size="15" fill="#66756c" text-anchor="start" font-weight="400">Non-users receiving &gt;1 call/month</text><line x1="641.60" y1="245.00" x2="1011.50" y2="245.00" stroke="#a8b99b" stroke-width="6"/><circle cx="641.60" cy="245.00" r="9" fill="#a5afa2"/><circle cx="1011.50" cy="245.00" r="11" fill="#355f47"/><text x="641.60" y="221.00" font-size="22" fill="#66756c" text-anchor="middle" font-weight="400">18%</text><text x="1011.50" y="221.00" font-size="22" fill="#355f47" text-anchor="middle" font-weight="600">45%</text><text x="1110.00" y="252.00" font-size="20" fill="#355f47" text-anchor="start" font-weight="400">+27 pp</text><text x="45.00" y="387.00" font-size="23" fill="#243c32" text-anchor="start" font-weight="600">First-line conversion</text><text x="45.00" y="417.00" font-size="15" fill="#66756c" text-anchor="start" font-weight="400">Prescribers with a first-line opportunity</text><line x1="723.80" y1="395.00" x2="847.10" y2="395.00" stroke="#a8b99b" stroke-width="6"/><circle cx="723.80" cy="395.00" r="9" fill="#a5afa2"/><circle cx="847.10" cy="395.00" r="11" fill="#355f47"/><text x="723.80" y="371.00" font-size="22" fill="#66756c" text-anchor="middle" font-weight="400">24%</text><text x="847.10" y="371.00" font-size="22" fill="#355f47" text-anchor="middle" font-weight="600">33%</text><text x="1110.00" y="402.00" font-size="20" fill="#355f47" text-anchor="start" font-weight="400">+9 pp</text><circle cx="80.00" cy="555.00" r="7" fill="#a5afa2"/><text x="98.00" y="562.00" font-size="17" fill="#66756c" text-anchor="start" font-weight="400">Before / historical comparator</text><circle cx="470.00" cy="555.00" r="7" fill="#355f47"/><text x="488.00" y="562.00" font-size="17" fill="#66756c" text-anchor="start" font-weight="400">After program launch</text><text x="45.00" y="626.00" font-size="15" fill="#66756c" text-anchor="start" font-weight="400">Conversion uses the prior four-quarter average as comparator. Populations differ by metric; differences are observational.</text></g></svg>