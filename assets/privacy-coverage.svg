<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Adding context changed escalation coverage</title><desc id="chart-desc">The scan alone flagged 3 of 15 patient-data-classified objects. The full rules-based pipeline escalated all 15.</desc><rect width="1200" height="650" fill="#f6f7f2" rx="10"/><g font-family="Arial,sans-serif"><text x="45.00" y="55.00" font-size="30" fill="#243c32" text-anchor="start" font-weight="600">Adding context changed escalation coverage</text><text x="45.00" y="91.00" font-size="18" fill="#66756c" text-anchor="start" font-weight="400">Evaluation on the fixed scan set, with documented object classification available to the rules.</text><line x1="140.00" y1="465.00" x2="1090.00" y2="465.00" stroke="#e0e6dc" stroke-width="1"/><text x="120.00" y="471.00" font-size="18" fill="#66756c" text-anchor="end" font-weight="400">0</text><line x1="140.00" y1="361.67" x2="1090.00" y2="361.67" stroke="#e0e6dc" stroke-width="1"/><text x="120.00" y="367.67" font-size="18" fill="#66756c" text-anchor="end" font-weight="400">5</text><line x1="140.00" y1="258.33" x2="1090.00" y2="258.33" stroke="#e0e6dc" stroke-width="1"/><text x="120.00" y="264.33" font-size="18" fill="#66756c" text-anchor="end" font-weight="400">10</text><line x1="140.00" y1="155.00" x2="1090.00" y2="155.00" stroke="#e0e6dc" stroke-width="1"/><text x="120.00" y="161.00" font-size="18" fill="#66756c" text-anchor="end" font-weight="400">15</text><text x="140.00" y="130.00" font-size="17" fill="#66756c" text-anchor="start" font-weight="400">Classified patient-data objects escalated</text><rect x="310.00" y="403.00" width="170.00" height="62.00" fill="#a8b99b" rx="4"/><text x="395.00" y="383.00" font-size="32" fill="#243c32" text-anchor="middle" font-weight="600">3 / 15</text><text x="395.00" y="507.00" font-size="22" fill="#243c32" text-anchor="middle" font-weight="400">Scan alone</text><rect x="755.00" y="155.00" width="170.00" height="310.00" fill="#355f47" rx="4"/><text x="840.00" y="135.00" font-size="32" fill="#243c32" text-anchor="middle" font-weight="600">15 / 15</text><text x="840.00" y="507.00" font-size="22" fill="#243c32" text-anchor="middle" font-weight="400">Full pipeline</text><text x="140.00" y="568.00" font-size="18" fill="#66756c" text-anchor="start" font-weight="400">Same 15 classified objects. Review and quarantine both count as escalation.</text><text x="45.00" y="626.00" font-size="15" fill="#66756c" text-anchor="start" font-weight="400">Prototype evaluation. The classification is a rule input; this is coverage on the scan set, not sensitivity on unseen data.</text></g></svg>