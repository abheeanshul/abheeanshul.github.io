<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="chart-title chart-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="chart-title">Choosing diagnostic resolution over smoother fit</title><desc id="chart-desc">Recorded test-data R squared decreases from 0.90 to 0.71, and national-level R squared from 0.60 to 0.34.</desc><rect width="1200" height="650" fill="#f6f7f2" rx="10"/><g font-family="Arial,sans-serif"><text x="45.00" y="55.00" font-size="30" fill="#243c32" text-anchor="start" font-weight="600">Choosing diagnostic resolution over smoother fit</text><text x="45.00" y="91.00" font-size="18" fill="#66756c" text-anchor="start" font-weight="400">What changed when the model moved from a rolling three-month view to monthly data.</text><line x1="100.00" y1="470.00" x2="1130.00" y2="470.00" stroke="#e0e6dc" stroke-width="1"/><text x="82.00" y="475.00" font-size="16" fill="#66756c" text-anchor="end" font-weight="400">0.00</text><line x1="100.00" y1="392.50" x2="1130.00" y2="392.50" stroke="#e0e6dc" stroke-width="1"/><text x="82.00" y="397.50" font-size="16" fill="#66756c" text-anchor="end" font-weight="400">0.25</text><line x1="100.00" y1="315.00" x2="1130.00" y2="315.00" stroke="#e0e6dc" stroke-width="1"/><text x="82.00" y="320.00" font-size="16" fill="#66756c" text-anchor="end" font-weight="400">0.50</text><line x1="100.00" y1="237.50" x2="1130.00" y2="237.50" stroke="#e0e6dc" stroke-width="1"/><text x="82.00" y="242.50" font-size="16" fill="#66756c" text-anchor="end" font-weight="400">0.75</text><line x1="100.00" y1="160.00" x2="1130.00" y2="160.00" stroke="#e0e6dc" stroke-width="1"/><text x="82.00" y="165.00" font-size="16" fill="#66756c" text-anchor="end" font-weight="400">1.00</text><text x="100.00" y="130.00" font-size="17" fill="#66756c" text-anchor="start" font-weight="400">Recorded R²</text><rect x="258.00" y="191.00" width="80.00" height="279.00" fill="#a8b99b" rx="3"/><text x="298.00" y="177.00" font-size="24" fill="#243c32" text-anchor="middle" font-weight="600">0.90</text><rect x="362.00" y="249.90" width="80.00" height="220.10" fill="#355f47" rx="3"/><text x="402.00" y="235.90" font-size="24" fill="#243c32" text-anchor="middle" font-weight="600">0.71</text><text x="350.00" y="507.00" font-size="20" fill="#243c32" text-anchor="middle" font-weight="400">Test-data score</text><rect x="778.00" y="284.00" width="80.00" height="186.00" fill="#a8b99b" rx="3"/><text x="818.00" y="270.00" font-size="24" fill="#243c32" text-anchor="middle" font-weight="600">0.60</text><rect x="882.00" y="364.60" width="80.00" height="105.40" fill="#355f47" rx="3"/><text x="922.00" y="350.60" font-size="24" fill="#243c32" text-anchor="middle" font-weight="600">0.34</text><text x="870.00" y="507.00" font-size="20" fill="#243c32" text-anchor="middle" font-weight="400">National-level score</text><rect x="95.00" y="555.00" width="18.00" height="18.00" fill="#a8b99b" rx="2"/><text x="125.00" y="571.00" font-size="17" fill="#66756c" text-anchor="start" font-weight="400">Rolling three-month</text><rect x="415.00" y="555.00" width="18.00" height="18.00" fill="#355f47" rx="2"/><text x="445.00" y="571.00" font-size="17" fill="#66756c" text-anchor="start" font-weight="400">Monthly</text></g></svg>