<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">From prescribing behavior to field action</title><desc id="desc">Two behavior measures define four interpretable prescriber segments. Each segment receives a different field action.</desc><rect width="880" height="440" rx="12" fill="#f1f4ef"/><g font-family="Arial,sans-serif" fill="#243c32">
<text x="44" y="55" font-size="14" letter-spacing="2">TURNING BEHAVIOR INTO A FIELD DECISION</text>
<text x="44" y="98" font-size="16" fill="#65766b">First-line use and share → interpretable segments → differentiated action</text>
<rect x="44" y="130" width="376" height="106" rx="8" fill="#dce6d8"/><text x="66" y="169" font-size="23">First-line majority</text><text x="66" y="204" font-size="17">Sustain adoption</text>
<rect x="438" y="130" width="398" height="106" rx="8" fill="white"/><text x="460" y="169" font-size="23">First-line occasional users</text><text x="460" y="204" font-size="17">Understand inconsistent adoption</text>
<rect x="44" y="254" width="376" height="106" rx="8" fill="white"/><text x="66" y="293" font-size="23">Second-line users</text><text x="66" y="328" font-size="17">Build first-line familiarity</text>
<rect x="438" y="254" width="398" height="106" rx="8" fill="#e6e5d8"/><text x="460" y="293" font-size="23">Non-users</text><text x="460" y="328" font-size="17">Address awareness and treatment habits</text>
<text x="44" y="405" font-size="14" fill="#65766b">Conceptual reconstruction. Employer product and internal terminology omitted.</text></g></svg>